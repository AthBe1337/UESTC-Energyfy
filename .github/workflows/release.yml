name: Build and Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        shell: bash
        run: |
          sed -i 's/[=<>]=.*//g' requirements.txt
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Energyfy (PyInstaller)
        run: |
          pyinstaller -F Energyfy.py

      - name: Build ConfigManager (CMake)
        run: |
          cmake -S external/ConfigManager -B build_cm -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DNOMINMAX"
          cmake --build build_cm --config Release

      - name: Prepare Package
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          mkdir release_dist
          cp dist/Energyfy.exe release_dist/
          cp build_cm/Release/ConfigManager.exe release_dist/
          cp schema.json release_dist/

      - name: Create Zip Archive
        shell: pwsh
        run: |
          $Version = $env:VERSION
          $ZipName = "Energyfy_${Version}_windows_amd64.zip"
          Compress-Archive -Path release_dist/* -DestinationPath $ZipName
          echo "ASSET_PATH=$ZipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-dev cmake build-essential

      - name: Build and Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          sed -i 's/[=<>]=.*//g' requirements.txt
          
          pip3 install -r requirements.txt
          pip3 install pyinstaller
          
          pyinstaller -F Energyfy.py
          
          cmake -S external/ConfigManager -B build_cm -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DNOMINMAX"
          cmake --build build_cm --parallel
          
          mkdir -p temp_dist
          cp dist/Energyfy temp_dist/
          cp build_cm/ConfigManager temp_dist/
          cp schema.json temp_dist/
          
          TAR_NAME="Energyfy_${VERSION}_linux_amd64.tar.gz"
          cd temp_dist
          tar -czvf ../${TAR_NAME} *
          
          echo "ASSET_PATH=${PWD}/../${TAR_NAME}" >> $GITHUB_ENV

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in QEMU
        uses: uraimo/run-on-arch-action@v3
        id: build
        with:
          arch: aarch64
          distro: ubuntu24.04
          setup: |
            mkdir -p "${PWD}/artifacts"
          dockerRunArgs: |
            --volume "${PWD}/artifacts:/artifacts"
          install: |
            apt-get update
            apt-get install -y python3 python3-pip python3-dev cmake build-essential git python3-venv
          run: |
            VERSION=${GITHUB_REF#refs/tags/}
            sed -i 's/[=<>]=.*//g' requirements.txt

            python3 -m venv .venv
            source .venv/bin/activate
            pip3 install -r requirements.txt
            pip3 install pyinstaller
            
            pyinstaller -F Energyfy.py
            
            cmake -S external/ConfigManager -B build_cm -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DNOMINMAX"
            cmake --build build_cm --parallel
            
            mkdir -p temp_dist
            cp dist/Energyfy temp_dist/
            cp build_cm/ConfigManager temp_dist/
            cp schema.json temp_dist/
            
            TAR_NAME="Energyfy_${VERSION}_linux_arm64.tar.gz"
            cd temp_dist
            tar -czvf /artifacts/${TAR_NAME} *
            
            echo "::set-output name=artifact_name::${TAR_NAME}"

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/${{ steps.build.outputs.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
